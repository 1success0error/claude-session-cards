<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude 历史会话</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="搜索标题、路径或对话内容" aria-label="搜索历史会话">
    <select id="project" aria-label="按项目筛选"></select>
    <button id="refresh" type="button">刷新</button>
  </header>
  <p id="summary" role="status"></p>
  <main id="list"></main>
  <div id="menu" role="menu" hidden></div>
  <script src="history.js"></script>
</body>
</html>
